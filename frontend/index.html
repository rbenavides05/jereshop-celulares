<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jereshop | Catálogo de Celulares</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="inicio">
  <div class="container hero-content">
    <div class="hero-text">
      <h2>Celulares originales al mejor precio</h2>
      <p>
        Encuentra tu próximo smartphone en Jereshop.
        Compra o consulta directamente por WhatsApp.
      </p>
      <a href="#productos" class="btn-primary">Ver catálogo</a>
    </div>
  </div>
</section>

    <section class="products-section" id="productos">
      <div class="container">
        <h2 class="section-title">Nuestros productos</h2>
        <div id="products-container" class="products-grid">
          <p class="loading">Cargando productos...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="contacto">
    <div class="container">
      <p>Jereshop - Venta de celulares</p>
      <p>Contáctanos por WhatsApp para más información</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
